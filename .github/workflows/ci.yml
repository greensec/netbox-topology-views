name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  frontend:
    name: Build front-end bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: ./netbox_topology_views/static_dev

      - name: Bundle scripts and styles
        run: npm run bundle
        working-directory: ./netbox_topology_views/static_dev

      - name: Ensure committed bundles are in sync
        run: git diff --exit-code

  backend:
    name: Back-end smoke tests (NetBox ${{ matrix.netbox-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        netbox-version:
          - v4.5.10
          - v4.6.4
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout NetBox
        uses: actions/checkout@v4
        with:
          repository: netbox-community/netbox
          ref: ${{ matrix.netbox-version }}
          path: netbox

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NetBox and plugin
        run: |
          python -m pip install --upgrade pip
          pip install -r netbox/requirements.txt
          pip install ./plugin

      - name: Create NetBox CI configuration
        run: |
          mkdir -p /tmp/netbox-static
          cat > netbox/netbox/netbox/configuration.py <<'PY'
          ALLOWED_HOSTS = ['*']

          DATABASE = {
              'NAME': 'netbox',
              'USER': 'netbox',
              'PASSWORD': 'netbox',
              'HOST': '127.0.0.1',
              'PORT': '',
              'CONN_MAX_AGE': 300,
          }

          DEBUG = False

          PLUGINS = ['netbox_topology_views']

          REDIS = {
              'tasks': {
                  'HOST': '127.0.0.1',
                  'PORT': 6379,
                  'PASSWORD': '',
                  'DATABASE': 0,
                  'SSL': False,
              },
              'caching': {
                  'HOST': '127.0.0.1',
                  'PORT': 6379,
                  'PASSWORD': '',
                  'DATABASE': 1,
                  'SSL': False,
              }
          }

          SECRET_KEY = 'ci-test-secret-key-not-for-production-0123456789abcdef'

          STATIC_ROOT = '/tmp/netbox-static'
          PY

      - name: Check for missing migrations
        working-directory: netbox/netbox
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        working-directory: netbox/netbox
        run: python manage.py migrate

      - name: Collect static files
        working-directory: netbox/netbox
        run: python manage.py collectstatic --no-input

      - name: Compile Python sources
        run: python -m compileall plugin/netbox_topology_views

  playwright:
    name: Playwright UI tests (NetBox ${{ matrix.netbox-version }})
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        netbox-version:
          - v4.5.10
          - v4.6.4
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout NetBox
        uses: actions/checkout@v4
        with:
          repository: netbox-community/netbox
          ref: ${{ matrix.netbox-version }}
          path: netbox

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NetBox, plugin, and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r netbox/requirements.txt
          pip install -r plugin/requirements-dev.txt
          pip install -e ./plugin

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Create NetBox CI configuration
        run: |
          mkdir -p /tmp/netbox-static
          cat > netbox/netbox/netbox/configuration.py <<'PY'
          ALLOWED_HOSTS = ['*']

          DATABASE = {
              'NAME': 'netbox',
              'USER': 'netbox',
              'PASSWORD': 'netbox',
              'HOST': '127.0.0.1',
              'PORT': '',
              'CONN_MAX_AGE': 300,
          }

          DEBUG = True

          PLUGINS = ['netbox_topology_views']

          REDIS = {
              'tasks': {
                  'HOST': '127.0.0.1',
                  'PORT': 6379,
                  'PASSWORD': '',
                  'DATABASE': 0,
                  'SSL': False,
              },
              'caching': {
                  'HOST': '127.0.0.1',
                  'PORT': 6379,
                  'PASSWORD': '',
                  'DATABASE': 1,
                  'SSL': False,
              }
          }

          SECRET_KEY = 'ci-test-secret-key-not-for-production-0123456789abcdef'

          STATIC_ROOT = '/tmp/netbox-static'
          PY

      - name: Run migrations
        working-directory: netbox/netbox
        run: python manage.py migrate

      - name: Collect static files
        working-directory: netbox/netbox
        run: python manage.py collectstatic --no-input

      - name: Run Playwright tests
        run: |
          export NETBOX_DIR="${{ github.workspace }}/netbox/netbox"
          export NETBOX_BASE_URL="http://127.0.0.1:8000"
          pytest "${{ github.workspace }}/plugin/tests" -v

